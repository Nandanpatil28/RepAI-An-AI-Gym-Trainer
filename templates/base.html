<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>{% block title %}RepAI{% endblock %}</title><link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}"><link rel="stylesheet" href="{{ url_for('static', filename='css/video.css') }}"><link rel="stylesheet" href="{{ url_for('static', filename='css/mobile.css') }}"><link rel="stylesheet" href="{{ url_for('static', filename='css/brand.css') }}"></head><body><header class="nav"><a class="brand repai-brand" href="{{ url_for('dashboard') }}"><svg viewBox="0 0 64 64" aria-hidden="true"><path d="M8 27v10m8-16v22m32-22v22m8-16v10M16 32h32M22 25v14m20-14v14"/><path d="M20 22h5v20h-5zm19 0h5v20h-5z"/></svg><span>RepAI</span></a>{% if session.get('user_id') %}<nav><a href="{{ url_for('dashboard') }}">Dashboard</a><a href="{{ url_for('history') }}">History</a><a href="{{ url_for('logout') }}">Logout</a></nav>{% endif %}</header><main class="container">{% with messages=get_flashed_messages(with_categories=true) %}{% for category,message in messages %}<div class="flash {{ category }}">{{ message }}</div>{% endfor %}{% endwith %}{% block content %}{% endblock %}</main></body></html>
